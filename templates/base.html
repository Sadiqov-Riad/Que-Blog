{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Que Blog{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --text-main: #0f172a;
        --bg-color: #f8fafc;
        --accent-red: #b91c1c;
      }
      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
      }
      .navbar-glass {
        background: rgba(255, 255, 255, 0.85) !important;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }
      .post-card { 
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        border: 1px solid rgba(0, 0, 0, 0.05);
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 1.25rem !important;
      }
      .glass-panel {
        border: 1px solid rgba(0, 0, 0, 0.05);
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 1.25rem !important;
      }
      .post-card:hover { 
        transform: translateY(-6px); 
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05)!important; 
        border-color: rgba(0, 0, 0, 0.1);
      }
      .btn-primary {
        background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
        border: none;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
        font-weight: 600;
        border-radius: 0.5rem;
        color: white;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
        color: white;
      }
      .article-content img { max-width: 100%; border-radius: 16px; margin: 20px 0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
      .badge-custom {
        background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
        color: white;
        padding: 0.4em 0.8em;
        border-radius: 9999px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      @keyframes fade-in-up {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100">
    {% include "partials/_navbar.html" %}
    
    <main class="container my-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          {% block content %}{% endblock %}
        </div>
      </div>
    </main>

    <footer class="bg-white text-dark text-center py-5 mt-auto" style="border-top: 1px solid rgba(0, 0, 0, 0.05);">
      <div class="container">
        <p class="mb-0 fw-bold">&copy; 2026 Que Blog. ITM Step.</p>
        <small class="text-muted">News, Programming, Design and more.</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
