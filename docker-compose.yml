services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-que_blog}
      POSTGRES_USER: ${POSTGRES_USER:-que_blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-que_blog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
