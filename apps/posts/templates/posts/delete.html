{% extends "base.html" %}
{% block title %}Delete Post{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm border-0 glass-panel" style="border-radius: 1rem;">
        <div class="card-body p-5 text-center">
          <div class="mb-4">
            <i class="bi bi-exclamation-triangle text-danger" style="font-size: 5rem;"></i>
          </div>
          <h2 class="fw-bolder mb-3 text-dark">Are you sure?</h2>
          <p class="text-secondary mb-4">
            You are about to delete the post <strong>"{{ post.title }}"</strong>. This action cannot be undone.
          </p>
          
          <form method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3">
              <a href="{% url 'posts:detail' post.id %}" class="btn btn-outline-secondary rounded-pill px-4 fw-bold">
                Cancel
              </a>
              <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold shadow-sm">
                <i class="bi bi-trash3-fill me-1"></i> Yes, delete it
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
